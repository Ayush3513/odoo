[options]
; RENDER FREE TIER OPTIMIZATIONS
; ------------------------------

; Use threaded mode (workers=0) to minimize RAM usage.
; Multiprocessing (workers>0) consumes ~1GB+ RAM which will crash the 512MB instance.
workers = 0

; Increase timeouts to allow slow startup on shared CPU
limit_time_cpu = 600
limit_time_real = 1200

; Paths
addons_path = /opt/odoo/addons
data_dir = /var/lib/odoo

; Database (Injected via Env Vars, but defaults here)
db_host = False
db_port = False
db_user = False
db_password = False

; Logs
log_level = info
