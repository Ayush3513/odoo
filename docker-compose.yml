services:
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./odoo.conf:/etc/odoo.conf
      - ./addons:/opt/odoo/addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - DB_HOST=db
      - DB_USER=odoo
      - DB_PASSWORD=CHANGE_ME_DB_PASSWORD
    restart: always

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=CHANGE_ME_DB_PASSWORD
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data:
