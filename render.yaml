services:
  # The Odoo Web Application
  - type: web
    name: odoo-server
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: odoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo-db
          property: password
      - key: ADMIN_PASSWD
        generateValue: true
      - key: PORT
        value: 8069

databases:
  # The PostgreSQL Database
  - name: odoo-db
    databaseName: odoo
    user: odoo
    plan: free
